name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build token artifacts
        run: pnpm --filter @nova/design-tokens build

      - name: Bootstrap reproducibility artifacts
        if: github.event_name == 'pull_request'
        run: |
          git add -f pnpm-lock.yaml packages/design-tokens/dist/tokens.css packages/design-tokens/dist/tokens.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: commit lockfile and generated token artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Quality gates
        run: pnpm check
