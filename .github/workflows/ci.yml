name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Show formatting diff
        run: |
          pnpm format
          git diff -- packages/design-tokens/package.json packages/ui/.storybook/preview.ts packages/ui/package.json tooling/eslint/package.json tooling/token-build/build.mjs
          git diff --exit-code
