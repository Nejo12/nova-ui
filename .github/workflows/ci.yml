name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build token artifacts
        run: pnpm --filter @nova/design-tokens build

      - name: Upload bootstrap artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foundation-bootstrap
          path: |
            pnpm-lock.yaml
            packages/design-tokens/dist/tokens.css
            packages/design-tokens/dist/tokens.json

      - name: Quality gates
        run: pnpm check
