name: Browser accessibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  overlays:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @nova-component/design-tokens build
      - run: pnpm typecheck:browser
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-accessibility-failures
          path: test-results/browser-a11y
          retention-days: 7
